# Memoria da JVM do Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# compila em paralelo e reaproveita a saida das tarefas entre builds
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX (obrigatorio a partir do AGP 8)
android.useAndroidX=true

# gera R.java so com os recursos do proprio modulo
android.nonTransitiveRClass=true
