spring.application.name=jcondo

# ---------------------------------------------------------------------------
# Banco padrao: MySQL (mesma configuracao usada na Atividade Avaliativa 1).
# Para subir a API sem instalar o MySQL, use o perfil "h2":
#   mvnw spring-boot:run -Dspring-boot.run.profiles=h2
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/jcondo
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# consultas fechadas junto com a transacao do service, e nao no fim da
# requisicao: as respostas ja saem prontas em DTO, entao nao ha lazy loading
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# API REST consumida pelo app JCondo Mobile
# ---------------------------------------------------------------------------
# 0.0.0.0 permite acessar a API de um celular fisico na mesma rede Wi-Fi
server.address=0.0.0.0
server.port=8080

# datas em texto ISO ("2026-09-10T19:00:00") em vez de numero epoch,
# que e o formato que o Gson do aplicativo espera
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=always

# Swagger: http://localhost:8080/swagger-ui/index.html
springdoc.swagger-ui.path=/swagger-ui.html
