<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Moradores')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout :: navbar}"></nav>

<main class="container my-4 flex-grow-1">

    <!-- mensagens que vem por flash attribute depois de salvar/excluir -->
    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>
    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <h1 class="h3 mb-0">
            <i class="bi bi-people-fill me-2 text-primary"></i>Moradores
        </h1>
        <a th:href="@{/moradores/novo}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Novo
        </a>
    </div>

    <!-- quando nao tem nenhum morador cadastrado -->
    <div th:if="${#lists.isEmpty(moradores)}" class="card jc-card">
        <div class="card-body text-center py-5">
            <i class="bi bi-inbox display-4 text-muted"></i>
            <p class="mt-3 mb-0 text-muted">Nenhum morador cadastrado ainda.</p>
            <a th:href="@{/moradores/novo}" class="btn btn-outline-primary mt-3">
                <i class="bi bi-person-plus me-1"></i>Cadastrar o primeiro morador
            </a>
        </div>
    </div>

    
    <div th:unless="${#lists.isEmpty(moradores)}" class="card jc-card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0 jc-table">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Nome</th>
                        <th scope="col">Apto</th>
                        <th scope="col">Bloco</th>
                        <th scope="col">CPF</th>
                        <th scope="col">Telefone</th>
                        <th scope="col">E-mail</th>
                        <th scope="col" class="text-end">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="m : ${moradores}">
                        <td th:text="${m.id}">1</td>
                        <td class="fw-semibold" th:text="${m.nome}">Nome</td>
                        <td><span class="badge text-bg-light border" th:text="${m.apartamento}">101</span></td>
                        <td><span class="badge text-bg-light border" th:text="${m.bloco}">A</span></td>
                        <td th:text="${m.cpf}">000.000.000-00</td>
                        <td th:text="${m.telefone}">(00) 00000-0000</td>
                        <td th:text="${m.email}">email@exemplo.com</td>
                        <td class="text-end">
                            <a th:href="@{/moradores/editar/{id}(id=${m.id})}"
                               class="btn btn-sm btn-outline-primary me-1" title="Editar">
                                <i class="bi bi-pencil-square"></i>
                            </a>
                            <a th:href="@{/moradores/excluir/{id}(id=${m.id})}"
                               class="btn btn-sm btn-outline-danger" title="Excluir"
                               onclick="return confirm('Deseja realmente excluir este morador?');">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer bg-white text-muted small">
            <i class="bi bi-sort-alpha-down me-1"></i>
            Total: <span th:text="${#lists.size(moradores)}">0</span> morador(es), ordenados por nome.
        </div>
    </div>

</main>

<footer th:replace="~{layout :: rodape}"></footer>
<th:block th:replace="~{layout :: scripts}"></th:block>

</body>
</html>
