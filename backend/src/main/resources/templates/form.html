<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${titulo})}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout :: navbar}"></nav>

<main class="container my-4 flex-grow-1">

    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">

            <div class="card jc-card">
                <div class="card-header bg-white">
                    <h1 class="h4 mb-0">
                        <i class="bi bi-person-vcard me-2 text-primary"></i>
                        <span th:text="${titulo}">Novo Morador</span>
                    </h1>
                </div>
                <div class="card-body">

                    <form th:action="@{/moradores/salvar}" th:object="${morador}" method="post" novalidate>

                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" id="nome" th:field="*{nome}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'"
                                       placeholder="Nome completo do morador">
                                <div class="invalid-feedback" th:errors="*{nome}"></div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="apartamento" class="form-label">Apartamento <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-door-closed"></i></span>
                                    <input type="text" id="apartamento" th:field="*{apartamento}"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('apartamento')} ? 'is-invalid'"
                                           placeholder="Ex.: 101">
                                    <div class="invalid-feedback" th:errors="*{apartamento}"></div>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="bloco" class="form-label">Bloco <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-building"></i></span>
                                    <input type="text" id="bloco" th:field="*{bloco}"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('bloco')} ? 'is-invalid'"
                                           placeholder="Ex.: A">
                                    <div class="invalid-feedback" th:errors="*{bloco}"></div>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="cpf" class="form-label">CPF <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-credit-card-2-front"></i></span>
                                    <input type="text" id="cpf" th:field="*{cpf}"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('cpf')} ? 'is-invalid'"
                                           placeholder="000.000.000-00" maxlength="14">
                                    <div class="invalid-feedback" th:errors="*{cpf}"></div>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="telefone" class="form-label">Telefone <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                    <input type="text" id="telefone" th:field="*{telefone}"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('telefone')} ? 'is-invalid'"
                                           placeholder="(00) 00000-0000" maxlength="20">
                                    <div class="invalid-feedback" th:errors="*{telefone}"></div>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="email" class="form-label">E-mail <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" id="email" th:field="*{email}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                       placeholder="morador@exemplo.com">
                                <div class="invalid-feedback" th:errors="*{email}"></div>
                            </div>
                        </div>

                        <!-- acesso ao app mobile: o morador entra com o e-mail acima -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="senha" class="form-label">Senha do aplicativo</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-key"></i></span>
                                    <input type="password" id="senha" th:field="*{senha}"
                                           class="form-control" autocomplete="new-password"
                                           placeholder="Deixe em branco para manter a atual">
                                </div>
                                <div class="form-text">
                                    Em um cadastro novo sem senha, o padrão é <strong>123456</strong>.
                                </div>
                            </div>
                            <div class="col-md-6 mb-4">
                                <label for="perfil" class="form-label">Perfil de acesso</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                                    <select id="perfil" th:field="*{perfil}" class="form-select">
                                        <option value="MORADOR">Morador</option>
                                        <option value="ADMIN">Administração / síndico</option>
                                    </select>
                                </div>
                                <div class="form-text">
                                    O perfil ADMIN pode publicar avisos pelo aplicativo.
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/moradores}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-lg me-1"></i>Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg me-1"></i>Salvar
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</main>

<footer th:replace="~{layout :: rodape}"></footer>
<th:block th:replace="~{layout :: scripts}"></th:block>

</body>
</html>
