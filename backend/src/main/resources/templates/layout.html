<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' - JCondo'">JCondo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<!-- navbar usada em todas as paginas -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark jc-navbar shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/moradores}">
            <i class="bi bi-buildings me-2"></i>JCondo
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
                aria-expanded="false" aria-label="Alternar navegação">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/moradores}">
                        <i class="bi bi-people me-1"></i>Moradores
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/moradores/novo}">
                        <i class="bi bi-person-plus me-1"></i>Novo Morador
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/swagger-ui/index.html" target="_blank">
                        <i class="bi bi-file-earmark-code me-1"></i>API (Swagger)
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>


<footer th:fragment="rodape" class="jc-footer text-center py-3 mt-auto">
    <small class="text-muted">JCondo &copy; 2026 — Sistema de Gestão de Moradores de Condomínio</small>
</footer>


<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
