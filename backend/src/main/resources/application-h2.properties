# ---------------------------------------------------------------------------
# Perfil "h2": banco em memoria, para rodar a API sem instalar o MySQL.
#
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
#
# O DataSeeder popula moradores, areas, avisos, uma reserva e uma ocorrencia
# a cada inicializacao. Os dados somem quando a aplicacao para - e o
# comportamento esperado para uma demonstracao.
# Console do banco: http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:jcondo)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:jcondo;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
